<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Ordered List</h1>
    <ol type="I">
      <li>Barang A</li>
      <li>Barang B</li>
      <li>Barang C</li>
    </ol>

    <h1>Unordered List</h1>
    <ul type="square">
      <li>Barang A</li>
      <li>Barang B</li>
      <li>Barang C</li>
    </ul>

    <h1>Description List</h1>
    <dl>
        <dt>
            List Barang
            <dd>Barang A</dd>
            <dd>Barang B</dd>
            <dd>Barang C</dd>
        </dt>
    </dl>
  </body>
</html>
