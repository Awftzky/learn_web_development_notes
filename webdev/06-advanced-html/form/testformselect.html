<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mencoba Select & Text Area</title>
  </head>
  <body>
    <h3>Pilih Kota</h3>
    <select name="kota" id="kota">
      <option value="">Pilih Kota</option>
      <option value="bdg">Bandung</option>
      <option value="mks" selected>Makassar</option>
      <option value="jkt">Jakarta</option>
    </select>
    <br />

    <h3>About Me:</h3>
    <textarea
      name="about"
      id="about"
      cols="50"
      rows="50"
      placeholder="Isi data diri anda"
    ></textarea>
    <br />
    <button type="submit">Kirim</button>
  </body>
</html>
