<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Background</title>
    <style>
      body {
        background-color: aqua;
        background-image: linear-gradient(
          to right top,
          green,
          lightblue,
          whitesmoke
        );
        height: 100vh;
      }

      .kotak1 {
        width: 300px;
        height: 300px;
        background-color: beige;
        background-image: linear-gradient(black, blue);
      }
      .kotak2 {
        width: 300px;
        height: 300px;
        background-color: beige;
        background-image: radial-gradient(blue, red);
      }
      .kotak3 {
        width: 300px;
        height: 300px;
        background-color: beige;
        background-image: conic-gradient(green, whitesmoke);
      }
    </style>
  </head>
  <body>
    <div class="kotak1"></div>
    <div class="kotak2"></div>
    <div class="kotak3"></div>
  </body>
</html>
