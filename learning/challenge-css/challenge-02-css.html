<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Challenge 02 CSS</title>
    <style>
      body {
        font-family: "Courier New", Courier, monospace;
        font-weight: bold;
        text-align: center;
      }
      h1 {
        color: cyan;
        font-size: 100px;
        font-style: italic;
        letter-spacing: 20px;
        text-decoration-color: gray;
        text-shadow: 5px 10px 0 gray;
      }

      p {
        font-size: 50px;
        line-height: 2;
        word-spacing: 50px;
      }

      figcaption {
        color: gray;
      }

      span {
        color: gray;
        text-decoration: line-through;
      }
    </style>
  </head>
  <body>
    <h1>FASE RUNTUH</h1>
    <figure>
      <blockquote>
        <p>
          "Tak Perlu Khawatir, Ku Hanya <span>Terluka</span> Terbiasa Tuk Pura
          Pura Tertawa. Namun Bolehkah sekali saja ku menangis? sebelum kembali
          membohongi diri."
        </p>
      </blockquote>
      <figcaption>- feby putri feat.fiersa besari</figcaption>
    </figure>
  </body>
</html>
