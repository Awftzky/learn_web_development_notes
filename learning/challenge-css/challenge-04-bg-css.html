<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Challenge 03 CSS</title>
    <style>
      body {
        font-family: "Courier New", Courier, monospace;
        font-weight: bold;
        text-align: center;
        background-color: transparent;
        background-image:
          linear-gradient(to bottom, rgb(15 23 42 / 90%), rgb(40 40 40 / 40%)),
          url(img/wallpaper.jpg);
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center bottom;
        background-attachment: fixed;
        min-height: 100vh;
      }
      h1 {
        color: transparent;
        background-image: linear-gradient(
          to right,
          rgb(0, 95, 183) 20%,
          rgb(124, 0, 225)
        );
        background-clip: text;
        font-size: 4em;
        font-style: italic;
        letter-spacing: 20px;
        filter: drop-shadow(0 0 10px rgb(118 255 228 / 20%));
      }

      blockquote {
        font-size: 5vh;
        line-height: 2;
        word-spacing: 50px;
        color: whitesmoke;
        background-color: rgb(255 255 255 / 5%);
        margin: auto;
        padding: 40px;
        border-radius: 20px;
        border: 1px solid rgb(red green blue / 10%);
        box-shadow: 0 10px 30px rgb(0 0 0 / 50%);
      }

      figcaption {
        color: gray;
      }

      span {
        color: crimson;
        text-decoration: none;
        text-shadow: 0 0 10px rgb(255, 88, 88);
      }
    </style>
  </head>
  <body>
    <h1>FASE RUNTUH</h1>

    <figure>
      <blockquote>
        <p>
          "Tak Perlu Khawatir, Ku Hanya <span>Terluka</span> Terbiasa Tuk Pura
          Pura Tertawa. Namun Bolehkah sekali saja ku menangis? sebelum kembali
          membohongi diri."
        </p>
      </blockquote>
      <figcaption>- feby putri feat.fiersa besari</figcaption>
    </figure>
  </body>
</html>
