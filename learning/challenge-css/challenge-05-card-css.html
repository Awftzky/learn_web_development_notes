<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan CSS | Sneaker Card</title>
    <style>
        * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        }

        body {
            background-color: lightskyblue;
            font-family: Arial, Helvetica, sans-serif;
        } 

        .shoes-card {
            background-color: white;
            width:  330px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #e0e0e0;
            box-shadow: 0 10px 20px rgb(0 0 0 / 0.1);
        }

        .shoes-card img {
          width: 100%;
          height: 100%;
          object-fit: cover;
        }

        .image-shoes {
          width: 100%;
          height: 220px;
          overflow: hidden;
            border-radius: 12px;
            margin: 0 0 30px 0;
            border: 1px solid #e0e0e0;
        }

        .brand-label {
            color: chocolate;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: bold;
        }

        .product-label{
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 12px;
        }

        .product-description {
          color: #666;
          font-size: 18px;
          line-height: 1.6;
          margin-bottom: 12px;
          padding-bottom: 20px;
          border-bottom: 1px solid #eee;
        }

        .product-price {
          margin-bottom: 20px;
        }

        .product-price .price {
          font-size: 26px;
          color: black;
          font-weight: bold;
        
        }

        .product-price .original-price {
          font-size: 14px;
          color: #999;
          font-weight: bold;
        text-decoration: line-through;
        margin-left: 8px;
        }

        /* SIZE OPTIONS WRAPPER */
        .size-option-wrapper {
          border: none;
        }

        .size-option-wrapper .size-label-text {
          font-weight: bold;
          font-size: 13px;
          color: #333;
          margin-bottom: 12px;
        }

        .size-option {
          margin-bottom: 25px;
        }

        .size-option input[type="radio"] {
          display: none;
        }

        .size-option label {
          display: inline-block;
          width: 44px;
          height: 44px;
          border: 2px solid #eee;
          text-align: center;
          line-height: 40px;
          font-weight: bold;
          cursor: pointer;
          color: #555;
          border-radius: 8px;
          margin-right: 5px;
          transition: 0.3s ease;
        }
        .size-option input[type="radio"]:checked+label {
          background-color: #000;
          border-color: #000;
          color: #e0e0e0;
        }
        
        .cart-button {
          width: 100%;
          padding: 16px;
          border: none;
          border-radius: 20px;
          background-color: black;
          color: whitesmoke;
          font-weight: bold;
          font-size: large;
          cursor: pointer;
          transition: 0.3 ease;
        }

        .cart-button:hover {
          background-color: #333;
        }

    </style>
  </head>
  <body>
    <article class="shoes-card">
      <figure class="image-shoes" >
      <img src="img/puma.jpg" alt="puma"/>
      </figure>
      <h3 class="brand-label">PUMA</h3>
      <h2 class="product-label">Puma Suede XL Royal Blue white</h1>
      <p class="product-description">
        Kombinasi Sempurna antara gaya streetwear bulky dan kenyamanan modern.
        Dilengkapi dengan teknologi strong outsole dan bantalan yang responsif
        untuk everyday wear
      </p>
      <div class="product-price">
        <span class="price">1,499,000</span>
        <del class="original-price">2,199,000</del>
      </div>
      <form action=""></form>
        <fieldset class="size-option-wrapper">
        <legend class="size-label-text">Pilih Ukuran (US):</legend>
          <div class="size-option">
            <input type="radio" name="size" id="s8" value="8">
            <label for="s8">8</label>

            <input type="radio" name="size" id="s9" value="9">
            <label for="s9">9</label>

            <input type="radio" name="size" id="s10" value="10">
            <label for="s10">10</label>

            <input type="radio" name="size" id="s11" value=11">
            <label for="s11">11</label>

            <input type="radio" name="size" id="s12" value="12">
            <label for="s12">12</label>

          </div>
      </fieldset>
</form>
      <button class="cart-button">
        TAMBAHKAN KE KERANJANG
      </button>
  
    </article>
  </body>
</html>
