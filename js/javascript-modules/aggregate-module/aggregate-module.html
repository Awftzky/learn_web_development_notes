<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aggregate Module</title>
  </head>
  <body>
    <h1>Aggregate Module</h1>
    <ul>
      <li id="greeting"></li>
      <li id="movie"></li>
      <li id="company"></li>
    </ul>

    <script type="module">
      // Ketiga export cukup dipanggil dari satu aggregate module.
      import { sayHello, Movie, company } from "./aggregate-module.mjs";

      const movie = new Movie("Interstellar", 2014);

      document.querySelector("#greeting").textContent = sayHello("Zaky");
      document.querySelector("#movie").textContent = movie.getInfo();
      document.querySelector("#company").textContent = company;

      console.info({ sayHello, Movie, company });
    </script>
  </body>
</html>
