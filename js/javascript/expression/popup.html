<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Popup</title>
    <script>
      // ALERT
      alert("Selamat Belajar Basic JS!");

      // PROMPT
      const nama = prompt("Masukkan Nama Anda :");

      alert(`Halo ${nama}`);

      // CONFIRM
      const masuk = confirm("Apakah Anda ingin masuk ke website ini?");

      if (masuk) {
        alert("Selamat Datang di Website ini!");
      } else {
        alert("Terima kasih telah berkunjung!");
      }
    </script>
  </head>
  <body>
    <h1>Popup Example</h1>
    <p><a href="index.html">← Expressions</a></p>
  </body>
</html>
