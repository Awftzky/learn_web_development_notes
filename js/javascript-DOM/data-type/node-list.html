<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Node List</title>
  </head>
  <body>
    <ul id="menu1">
      <li id="first">1</li>
      <li id="second">2</li>
      <li id="third">3</li>
    </ul>
    <script>
      const list = document.querySelectorAll("li");
      console.info(list);

      const menu1 = document.querySelectorAll("menu1").appendChild;

      // LIVE
      menu1.appendChild(document.createElement("li"));
      menu1.appendChild(document.createElement("li"));
      console.info(menu1);

      // STATIC
    </script>
  </body>
</html>
