<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML FORM ELEMENT</title>
  </head>
  <body>
    <form name="commentForm">
      <div>
        <label for="comment">Comment:</label>
        <input type="text" name="comment" id="comment" required />
      </div>

      <div>
        <label for="from">From:</label>
        <input type="text" name="from" id="from" required />
      </div>

      <button type="submit">Submit</button>
    </form>

    <div id="commentList"></div>

    <script>
      document.forms.commentForm.onsubmit = function (event) {
        event.preventDefault();

        const comment = document.forms.commentForm.elements.comment.value;
        const from = document.forms.commentForm.elements.from.value;

        const commentItem = document.createElement("p");
        commentItem.textContent = `${comment} - ${from}`;

        document.getElementById("commentList").appendChild(commentItem);
        document.forms.commentForm.reset();
      };
    </script>
  </body>
</html>
