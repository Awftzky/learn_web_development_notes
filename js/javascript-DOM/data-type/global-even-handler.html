<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Event Handler</title>
  </head>
  <body>
    <input id="click-me" type="button" value="click-me!" />

    <script>
      const clickMe = document.getElementById("click-me");

      // Global Event Handler menggunakan property onclick.
      clickMe.onclick = function () {
        clickMe.setAttribute("value", "You Have Already Clickme!");
      };
    </script>
  </body>
</html>
