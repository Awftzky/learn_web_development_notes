<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <div id="content-header"></div>
    </header>
    <main>
      <h1 id="title">Title</h1>
    </main>
    <footer>
      <div id="content" class="content">
        <h1 id="footer-title">@Awftky All Rights Reserved</h1>
      </div>
    </footer>
    <script>
      const title = document.getElementById("title");
      title.textContent = "Ini Adalah Sebuah Title";

      const description = document.getElementById("description");

      // ELEMENT PROPERTY
      const content = document.getElementById("content");
      console.info(content.className);
      console.info(content.tagName);

      // ELEMENT METHOD
      title.remove();
      content.remove();

      // CREATE ELEMENT
      const contentHeader = document.getElementById("content-header");

      const titleHeader = document.createElement("h1");
      titleHeader.textContent = "Ini adalah Header";
      contentHeader.appendChild(titleHeader);
    </script>
  </body>
</html>
