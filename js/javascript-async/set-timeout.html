<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function addElement() {
            const header = document.createElement("h1");
            header.textContent = "Aufa Azzaky Arief";

            document.body.appendChild(header);
        }
        // MELAKUKAN PEMANGGILAN SKALI DENGAN CARA ASYNCHRONUS
        setTimeout(addElement, 5000);
    </script>
</body>
</html>
